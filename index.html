<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAINAB COLLECTION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#faf9f7}
.h{padding:12px;background:#fff;display:flex;justify-content:space-between;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.s{padding:10px;background:#fff;position:sticky;top:54px;z-index:9;border-bottom:1px solid #eee;display:flex;gap:6px;position:relative}
.s input{flex:1;padding:10px;border:1px solid #111;border-radius:10px}
.s button{padding:10px 14px;background:#111;color:#fff;border:none;border-radius:10px}
#sugg{position:absolute; top:52px; left:10px; right:82px; background:#fff; border:1px solid #ddd; border-radius:10px; display:none; z-index:20; max-height:250px; overflow-y:auto}
#sugg div{padding:10px; font-size:12px; border-bottom:1px solid #eee; cursor:pointer}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
@media(min-width:700px){.g{grid-template-columns:repeat(4,1fr)}}
.c{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee;cursor:pointer}
.c img{width:100%;height:170px;object-fit:cover;background:#f3ede7}
.i{padding:8px}.n{font-size:12px;font-weight:700;height:34px;overflow:hidden;line-height:1.3}
.pr{font-weight:900;font-size:13px;margin-top:4px}.ol{font-size:10px;color:#999;text-decoration:line-through;margin-left:4px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:99;padding:10px;overflow-y:auto}
.bx{background:#fff;border-radius:16px;max-width:850px;margin:20px auto;overflow:hidden;display:grid}
@media(min-width:700px){.bx{grid-template-columns:1fr 1fr}}
.bx img.m{width:100%;height:320px;object-fit:cover}.pd{padding:14px;position:relative}
.cl{position:absolute;top:8px;right:8px;background:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.op{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.o{border:1px solid #eee;border-radius:10px;padding:6px;cursor:pointer}.o.sel{border-color:#111;background:#fdf6f2}
.o img{width:100%;height:60px;object-fit:cover;border-radius:6px}
.btn{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:10px;margin-top:12px;font-weight:700}
</style>
</head>
<body>
<div class="h"><div><b>ZAINAB COLLECTION</b><div style="font-size:10px;color:#777">ID: CA/DF1/316075 • No human pic</div></div><div>🛒<b id="cart">0</b></div></div>
<div class="s"><input id="q" placeholder="Search Abaya Hijab Bag..." oninput="showSugg()"><button onclick="doSearch()">Search</button><div id="sugg"></div></div>
<div class="g" id="grid"></div>
<div style="text-align:center;padding:16px;font-size:10px;color:#888">Zainab Collection • 14 Products • Halal Pics Only</div>
<div class="modal" id="modal" onclick="if(event.target==this)closeM()"><div class="bx"><img class="m" id="mImg"><div class="pd"><div class="cl" onclick="closeM()">×</div><h3 id="mT" style="font-size:13px"></h3><p id="mD" style="font-size:11px;color:#666;margin-top:5px"></p><div style="margin-top:8px"><b id="mP"></b><span id="mO" style="font-size:10px;color:#999;text-decoration:line-through;margin-left:4px"></span></div><h4 style="font-size:11px;margin-top:10px">Isi Category ke 4 Designs:</h4><div class="op" id="opts"></div><button class="btn" onclick="addC()">Add to Cart</button></div></div></div>
<script>
const prods=[
{id:1,cat:"abaya",n:"Black Front Open Abaya - Nida",p:3499,o:4599,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=500",d:"Nida fabric • Hanger display • No model"},
{id:2,cat:"abaya",n:"Brown Embroidered Abaya",p:3999,o:5299,img:"https://images.unsplash.com/photo-1582533561751-ef6f6ab93a2e?w=500",d:"Georgette • Folded • No person"},
{id:3,cat:"abaya",n:"Navy Blue Plain Abaya",p:2999,o:3999,img:"https://images.unsplash.com/photo-1578683010236-d716f9a3f461?w=500",d:"Daily wear • Umbrella cut"},
{id:4,cat:"abaya",n:"Beige Closed Abaya Belt",p:3699,o:4799,img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500",d:"Closed with belt • Folded fabric"},
{id:5,cat:"hijab",n:"Chiffon Hijab Black Folded",p:599,o:899,img:"https://images.unsplash.com/photo-1582142306909-195724d33ffc?w=500",d:"180cm • Folded stack"},
{id:6,cat:"hijab",n:"Undercap Hijab 2pcs",p:399,o:600,img:"https://images.unsplash.com/photo-1620799139507-7156ec1c9e92?w=500",d:"Cotton undercap"},
{id:7,cat:"hijab",n:"Georgette Hijab 3 Colors Set",p:1299,o:1899,img:"https://images.unsplash.com/photo-1582142306909-195724d33ffc?w=500",d:"3 colors • Folded"},
{id:8,cat:"bag",n:"PU Leather Tote Bag Black",p:3299,o:4299,img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500",d:"Only bag • No hand"},
{id:9,cat:"bag",n:"Hand Clutch Beige Embroidered",p:1499,o:2199,img:"https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?w=500",d:"Clutch • Product only"},
{id:10,cat:"bag",n:"School Backpack Black",p:1999,o:2799,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500",d:"Backpack only"},
{id:11,cat:"accessories",n:"Hijab Pins Box 50pcs",p:450,o:700,img:"https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=500",d:"Box only"},
{id:12,cat:"accessories",n:"Silver Anklet Box",p:599,o:899,img:"https://images.unsplash.com/photo-1611652022419-a9419f74343d?w=500",d:"Box display • No feet"},
{id:13,cat:"accessories",n:"Pearl Necklace Velvet Box",p:2499,o:3499,img:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=500",d:"Velvet box • No neck"},
{id:14,cat:"accessories",n:"Brown Leather Wallet",p:899,o:1299,img:"https://images.unsplash.com/photo-1627123424574-724758594e93?w=500",d:"Wallet with box"}
];
let cur=null,sel=null,cart=0;
function render(list=prods){let h="";list.forEach(p=>{h+=`<div class="c" onclick="openP(${p.id})"><img src="${p.img}" loading="lazy"><div class="i"><div class="n">${p.n}</div><div class="pr">Rs. ${p.p}<span class="ol">Rs. ${p.o}</span></div></div></div>`});document.getElementById('grid').innerHTML=h;}
function showSugg(){let q=document.getElementById('q').value.toLowerCase();let box=document.getElementById('sugg');if(!q){box.style.display="none";return;}let f=prods.filter(p=>p.n.toLowerCase().includes(q));if(f.length){box.style.display="block";box.innerHTML=f.map(p=>`<div onclick="openP(${p.id}); document.getElementById('sugg').style.display='none'">${p.n} - Rs.${p.p}</div>`).join("")}else{box.style.display="none"}}
function doSearch(){let q=document.getElementById('q').value.toLowerCase();if(!q){render();return;}let f=prods.filter(p=>p.n.toLowerCase().includes(q));render(f);document.getElementById('sugg').style.display="none"}
function openP(id){cur=prods.find(x=>x.id==id);document.getElementById('mT').innerText=cur.n;document.getElementById('mD').innerText=cur.d;document.getElementById('mImg').src=cur.img;document.getElementById('mP').innerText="Rs. "+cur.p;document.getElementById('mO').innerText="Rs. "+cur.o;
let related = prods.filter(p=>p.cat==cur.cat && p.id!=cur.id).slice(0,4);
if(related.length<3){ related = prods.filter(p=>p.id!=cur.id).slice(0,4); }
let oh="";related.forEach((o,i)=>{oh+=`<div class="o" id="o${i}" onclick="pick(${i},${o.p},'${o.img}','${o.n}')"><img src="${o.img}"><div style="font-size:10px;font-weight:700;margin-top:3px">${o.n.substring(0,20)}</div><div style="font-size:10px;font-weight:800">Rs. ${o.p}</div></div>`});
document.getElementById('opts').innerHTML=oh;sel=null;document.getElementById('modal').style.display="block";}
function pick(i,pr,img,name){document.querySelectorAll('.o').forEach(e=>e.classList.remove('sel'));document.getElementById('o'+i).classList.add('sel');sel=pr;document.getElementById('mP').innerText="Rs. "+pr;document.getElementById('mImg').src=img;document.getElementById('mT').innerText=name;}
function closeM(){document.getElementById('modal').style.display="none";}
function addC(){if(!sel)sel=cur.p;cart++;document.getElementById('cart').innerText=cart;closeM();}
render();
</script>
</body>
                                                                                                                                                             </html>
