<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAINAB COLLECTION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}
body{background:#faf8f5}
.h{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eee;padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1300px;margin:auto}
.logo{font-weight:900}
.search{max-width:1300px;margin:12px auto 0;display:flex;gap:8px}
.search input{flex:1;padding:12px 14px;border:1px solid #ddd;border-radius:12px;outline:none}
.search button{padding:12px 18px;border:none;background:#000;color:#fff;border-radius:12px;font-weight:700}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:14px;max-width:1300px;margin:auto}
@media(max-width:900px){.g{grid-template-columns:repeat(2,1fr)}}
.c{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden;cursor:pointer}
.c img{width:100%;height:230px;object-fit:cover;background:#fff}
.i{padding:10px}.n{font-size:13px;font-weight:700;height:36px;overflow:hidden;line-height:1.3}
.stars{color:#ffb400;font-size:12px;margin:4px 0}
.pr{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.new{font-weight:900;font-size:15px}.old{font-size:12px;color:#999;text-decoration:line-through}
.off{background:#e11;color:#fff;font-size:10px;padding:2px 6px;border-radius:20px;font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:99;overflow:auto}
#box{background:#fff;max-width:950px;margin:18px auto;border-radius:18px;overflow:hidden;position:relative}
#mainImg{width:100%;height:460px;object-fit:cover;background:#fff}
.thumbs{display:flex;gap:8px;padding:12px;overflow:auto;background:#fafafa}
.thumbs img{width:82px;height:82px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer;background:#fff}
.thumbs img.active{border-color:#000}
.det{padding:16px}.det h2{font-size:18px}
.det .row{display:flex;gap:8px;align-items:center;margin-top:8px}
.close{position:absolute;top:12px;right:16px;background:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;cursor:pointer;z-index:2}
.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:12px;margin-top:12px;font-weight:800;font-size:15px}
</style>
</head>
<body>
<div class="h">
<div class="top"><div class="logo">ZAINAB COLLECTION</div><div>🛒<b>0</b></div></div>
<div class="search"><input id="s" placeholder="Search bouquets, lunch box, shoes, cakes..."><button onclick="doSearch()">Search</button></div>
</div>
<div class="g" id="grid"></div>
<div id="modal"><div id="box"><div class="close" onclick="closeM()">×</div><img id="mainImg"><div class="thumbs" id="thumbs"></div><div class="det"><h2 id="mName"></h2><div class="row"><span id="mStars" class="stars"></span><span id="mRating" style="font-size:12px;color:#666"></span></div><div class="row" id="mPrice"></div><button class="btn">Add to Cart - Order Now on WhatsApp</button><p style="font-size:12px;color:#666;margin-top:10px">Inside similar colors / designs available</p></div></div></div>
<script>
const products=[
{id:1,name:"Frozen Lunch Box Set - Bottle + Box",price:649,old:899,rating:4.9,reviews:210,cover:"1.jpg",gallery:["1.jpg"]},
{id:2,name:"Red Roses Bouquet - White Wrap 50 Roses",price:2500,old:3200,rating:4.9,reviews:124,cover:"2.jpg",gallery:["2.jpg","3.jpg","4.jpg","5.jpg"]},
{id:3,name:"Chocolate Bouquet - KitKat + Dairy Milk + Roses",price:3500,old:4200,rating:4.8,reviews:210,cover:"3.jpg",gallery:["3.jpg","2.jpg","4.jpg"]},
{id:4,name:"100 Red Roses Big Bouquet Premium",price:5500,old:6999,rating:5.0,reviews:89,cover:"4.jpg",gallery:["4.jpg","2.jpg","3.jpg"]},
{id:5,name:"Star Chain Sneakers - 3 Colors - Size 36-41",price:3200,old:4200,rating:4.9,reviews:312,cover:"5.jpg",gallery:["5.jpg"]},
{id:6,name:"Purple Mix Bouquet - White & Pink Roses",price:2800,old:3500,rating:4.7,reviews:67,cover:"6.jpg",gallery:["6.jpg","2.jpg","3.jpg"]},
{id:7,name:"Breakfast Deal - French Toast + Soup + Iced Coffee",price:1200,old:1500,rating:4.6,reviews:45,cover:"7.jpg",gallery:["7.jpg","8.jpg"]},
{id:8,name:"Cake & Coffee - Strawberry + Lemon Slice",price:900,old:1200,rating:4.8,reviews:98,cover:"8.jpg",gallery:["8.jpg","7.jpg"]},
{id:9,name:"Pink & White Mix Roses Bouquet",price:2200,old:0,rating:4.8,reviews:153,cover:"9.jpg",gallery:["9.jpg","2.jpg","6.jpg"]}
];
function render(list){
document.getElementById('grid').innerHTML=list.map(p=>{
let off=p.old?Math.round((p.old-p.price)/p.old*100):0;
return `<div class="c" onclick="openM(${p.id})"><img src="${p.cover}" loading="lazy"><div class="i"><div class="n">${p.name}</div><div class="stars">★★★★★ <span style="color:#666;font-size:11px">(${p.reviews})</span></div><div class="pr"><span class="new">Rs. ${p.price}</span>${p.old?`<span class="old">Rs. ${p.old}</span><span class="off">-${off}%</span>`:''}</div></div></div>`;
}).join('');
}
render(products);
function doSearch(){
let q=document.getElementById('s').value.toLowerCase();
let f=products.filter(p=>p.name.toLowerCase().includes(q));
render(f.length?f:products);
}
document.getElementById('s').addEventListener('input',doSearch);
function openM(id){
let p=products.find(x=>x.id===id);
document.getElementById('mainImg').src=p.cover;
document.getElementById('mName').innerText=p.name;
document.getElementById('mStars').innerText='★★★★★';
document.getElementById('mRating').innerText=`${p.rating} (${p.reviews} reviews)`;
let off=p.old?Math.round((p.old-p.price)/p.old*100):0;
document.getElementById('mPrice').innerHTML=`<span style="font-weight:900;font-size:20px">Rs. ${p.price}</span> ${p.old?`<span style="color:#999;text-decoration:line-through;margin-left:8px">Rs. ${p.old}</span><span style="background:#e11;color:#fff;padding:2px 8px;border-radius:20px;font-size:12px;margin-left:8px">-${off}% OFF</span>`:''}`;
document.getElementById('thumbs').innerHTML=p.gallery.map((g,i)=>`<img src="${g}" class="${i==0?'active':''}" onclick="changeImg(this,'${g}')">`).join('');
document.getElementById('modal').style.display='block';
}
function changeImg(el,src){document.getElementById('mainImg').src=src;document.querySelectorAll('.thumbs img').forEach(i=>i.classList.remove('active'));el.classList.add('active');}
function closeM(){document.getElementById('modal').style.display='none';}
</script>
</body>
</html>
